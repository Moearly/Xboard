version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: xboard-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: xboard
      MYSQL_USER: xboard
      MYSQL_PASSWORD: xboard123
    ports:
      - "3307:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - xboard-test-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: xboard-redis-test
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data
    networks:
      - xboard-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # XBoard 应用
  xboard:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: xboard-app-test
    ports:
      - "8080:80"
    volumes:
      # 仅挂载需要持久化的数据目录
      - storage_test_data:/var/www/html/storage/app
      - storage_test_logs:/var/www/html/storage/logs
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
    environment:
      - APP_ENV=production
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=xboard
      - DB_USERNAME=xboard
      - DB_PASSWORD=xboard123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADMIN_DOMAIN=admin.xboard.test
      - SUPER_ADMIN_EMAILS=admin@xboard.test
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      xboard-test-network:
        aliases:
          - admin.xboard.test
          - tenant1.xboard.test
          - tenant2.xboard.test
          - tenant3.xboard.test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx（已内置在 XBoard 容器中，无需单独服务）
  # nginx:
  #   image: nginx:alpine
  #   container_name: xboard-nginx-test
  #   ports:
  #     - "8081:80"
  #   volumes:
  #     - ./docker/nginx/default.conf:/etc/nginx/http.d/default.conf
  #     - .:/var/www/html
  #   depends_on:
  #     - xboard
  #   networks:
  #     - xboard-test-network

volumes:
  mysql_test_data:
  redis_test_data:
  storage_test_data:
  storage_test_logs:

networks:
  xboard-test-network:
    driver: bridge

